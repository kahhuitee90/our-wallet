<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Our Wallet">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Our Wallet</title>
<style>
  :root { color-scheme: light; --bg:#f4f6f8; --card:#fff; --ink:#191919; --mute:#666; --pri:#0f766e; --line:#e5e7eb; --neg:#c62828; --pos:#0f766e;
    --s1:#257de0; --s2:#f47230; --track:#eef0f3; }
  @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --bg:#0d0d0d; --card:#191919; --ink:#efefef; --mute:#9c9c9c; --line:#2c2c2c; --neg:#ff7a7a; --pos:#4fd1b5;
    --s1:#338ced; --s2:#e76624; --track:#262626; } }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.4 system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--ink); padding-bottom:calc(72px + env(safe-area-inset-bottom)); }
  header { background:var(--pri); color:#fff; padding:calc(14px + env(safe-area-inset-top)) 16px 14px; font-weight:600; font-size:18px; }
  main { padding:12px; max-width:560px; margin:auto; }
  h2 { margin:0 0 6px; font-size:20px; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-bottom:12px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .err { color:var(--neg); }
  .hero .big { font-size:30px; font-weight:700; margin-top:2px; }
  .owe { margin-top:10px; padding-top:10px; border-top:1px solid var(--line); font-size:15px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .mid { font-size:15px; font-weight:700; margin-top:2px; white-space:nowrap; letter-spacing:-.2px; }
  .neg { color:var(--neg); } .pos { color:var(--pos); }
  .mute { color:var(--mute); font-size:14px; }
  .ctitle { font-weight:600; margin-bottom:8px; }
  .row { display:flex; gap:8px; align-items:center; }
  .row > * { flex:1; }
  .tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .tile { padding:10px; margin-bottom:12px; }
  .pnav { display:flex; justify-content:space-between; align-items:center; margin:10px 0; }
  .pnav button { font-size:20px; padding:2px 14px; }
  label { display:block; font-size:14px; color:var(--mute); margin:12px 0 4px; }
  input, select { width:100%; padding:11px; font-size:16px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); }
  button { padding:12px; font-size:16px; border:0; border-radius:10px; background:var(--pri); color:#fff; font-weight:600; width:100%; cursor:pointer; }
  button:disabled { opacity:.6; }
  button.ghost { background:transparent; color:var(--pri); border:1px solid var(--pri); }
  button.small { padding:6px 10px; width:auto; font-size:14px; }
  .seg { display:flex; background:var(--line); border-radius:10px; padding:3px; gap:3px; }
  .seg button { background:transparent; color:var(--ink); padding:9px 4px; font-weight:500; }
  .seg button.on { background:var(--card); color:var(--pri); font-weight:700; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { width:auto; padding:7px 12px; font-size:14px; background:var(--line); color:var(--ink); font-weight:500; border-radius:999px; }
  .chip.on { background:var(--pri); color:#fff; }
  nav { position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--card); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
  nav button { background:transparent; color:var(--mute); border-radius:0; font-weight:500; padding:12px 0; }
  nav button.on { color:var(--pri); font-weight:700; }
  .tx { display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .tx:last-child { border-bottom:0; }
  .amt { white-space:nowrap; font-weight:600; }
  .item { display:grid; grid-template-columns:1fr 84px 92px 28px; gap:6px; margin-bottom:6px; }
  .item input, .item select { padding:8px; }
  .x { background:transparent; color:var(--neg); padding:0; font-size:20px; }
  .hidden { display:none !important; }
  /* charts */
  .chart { width:100%; height:auto; display:block; }
  .chart .s1, .chart .s2 { stroke:var(--card); stroke-width:1; }
  .s1 { fill:var(--s1); background:var(--s1); } .s2 { fill:var(--s2); background:var(--s2); }
  .axis { stroke:var(--line); }
  .tick { fill:var(--mute); font-size:10px; }
  .legend { display:flex; gap:14px; font-size:13px; color:var(--mute); margin-bottom:6px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
  .hbars { display:flex; flex-direction:column; gap:8px; }
  .hrow { display:grid; grid-template-columns:84px 1fr auto; gap:8px; align-items:center; font-size:14px; }
  .pgroup .hrow { grid-template-columns:1fr auto; margin-top:4px; }
  .hlabel { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .htrack { height:12px; background:var(--track); border-radius:4px; overflow:hidden; }
  .hfill { height:100%; border-radius:0 4px 4px 0; }
  .hval { font-variant-numeric:tabular-nums; white-space:nowrap; }
  .tip { position:fixed; display:none; z-index:10; background:var(--ink); color:var(--card); padding:6px 9px; border-radius:8px; font-size:13px; pointer-events:none; max-width:260px; }
</style>
</head>
<body>
<header id="title">Our Wallet</header>
<main id="app"><div class="card mute">Loading…</div></main>
<nav class="hidden">
  <button data-tab="dash" class="on">Dashboard</button>
  <button data-tab="add">Add</button>
  <button data-tab="settings">Settings</button>
</nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="split.js"></script>
<script src="api.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
